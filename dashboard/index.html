<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>40 SAR Personnel</title>
    <meta
      name="description"
      content="Daily strength, report sick, MC and status picture for battalion S1, S3 and the CO."
    />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      The theme is stamped before the first paint. Without this the page renders light,
      then flips, and a dark-mode viewer sees a white flash on every load.
    -->
    <script>
      (function () {
        try {
          var choice = window.localStorage.getItem('dashboard-theme');
          if (choice === 'light' || choice === 'dark') {
            document.documentElement.setAttribute('data-theme', choice);
          }
        } catch (error) {
          /* Storage is blocked; the media query still resolves the theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
