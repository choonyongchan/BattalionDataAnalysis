# Publishes the dashboard to GitHub Pages.
#
# Deploy-from-a-branch only offers "/" or "/docs" as the source folder, and "docs/" here
# already holds the architecture reference — so an Actions workflow is what lets Pages
# serve the dashboard. What is published is "dashboard/dist", the Vite build, not the
# source: the pages are Preact components and the stylesheet is split across five files,
# neither of which a browser can be handed directly. Its tests live in "test/dashboard/",
# outside that boundary, for the same reason "test/" sits outside "src/" — what ships is
# only what runs in the browser.
#
# Only code is published, and it carries no secret. The dashboard asks the Apps Script web
# app for the data at view time, and that endpoint refuses to answer without the password
# the viewer types — which is held in a script property on the Apps Script side and never
# reaches this repo. So no battalion data and no credential passes through this workflow,
# lands in an artifact, or is committed.

name: Deploy dashboard to Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-published dashboard is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The suite's only external dependency is fuse.js, imported by
      # "dashboard/src/model/soldier.js"; the rest of "dashboard/" is UI the tests never
      # load. fuse.js has no transitive dependencies, so resolve it on its own into
      # "dashboard/node_modules" — where Bun's module resolution finds it — rather than
      # running "bun install" and pulling echarts, preact and wouter for nothing. The
      # install happens in a throwaway directory so "dashboard/package.json" is ignored.
      # Pinned to the version in "dashboard/bun.lock".
      - name: Install the test-time dependency
        run: |
          mkdir -p dashboard/node_modules
          tmp="$(mktemp -d)"
          (cd "$tmp" && bun add fuse.js@7.5.0)
          mv "$tmp/node_modules/fuse.js" dashboard/node_modules/
      # The model layer is pure and needs no Google account or API key, so the whole suite
      # runs here — "./test/" covers the parser and the dashboard alike. A classification
      # or episode regression fails the deploy rather than reaching the CO as a wrong
      # number. The WhatsApp bridge's own tests are left to their own workflow: they need
      # that package's dependencies installed and nothing in it ships to Pages.
      - name: Run tests
        run: bun test ./test/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/configure-pages@v5
      - name: Install dashboard dependencies
        run: bun install --frozen-lockfile
        working-directory: dashboard
      - name: Build the dashboard
        run: bun run build
        working-directory: dashboard
      - name: Upload the built dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
